[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrcpy-flow"
version = "1.3.2"
description = "Image-driven Android automation with scrcpy, flow graphs, state preferences, fallbacks and a local Ollama vision brain"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "scrcpy-flow contributors" }]
keywords = ["android", "scrcpy", "adb", "automation", "image-matching", "flowchart", "tkinter", "ollama", "local-llm", "vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: System :: Hardware",
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "mss>=9.0",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.8"]
clip = ["open_clip_torch>=2.24", "torch>=2.0"]
ui2 = ["PySide6-Essentials>=6.6"]
pro = ["pynput>=1.7", "pytesseract>=0.3.10"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
scflow = "scflow.__main__:main"

[tool.setuptools.packages.find]
include = ["scflow*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
